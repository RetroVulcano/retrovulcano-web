<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" shape-rendering="crispEdges">
  <rect width="320" height="160" fill="none"/>
  <!-- 8-bit triangular spacecraft -->
  <!-- engine flame -->
  <rect x="16" y="72" width="12" height="16" fill="#ff5a36"/>
  <rect x="4" y="76" width="12" height="8" fill="#ffb52e"/>
  <rect x="28" y="76" width="12" height="8" fill="#e6ff3f"/>

  <!-- triangular hull -->
  <rect x="48" y="72" width="16" height="16" fill="#aeb4bc"/>
  <rect x="64" y="64" width="16" height="32" fill="#d9dde0"/>
  <rect x="80" y="56" width="16" height="48" fill="#f2f0e8"/>
  <rect x="96" y="48" width="16" height="64" fill="#f2f0e8"/>
  <rect x="112" y="40" width="16" height="80" fill="#f2f0e8"/>
  <rect x="128" y="32" width="16" height="96" fill="#f2f0e8"/>
  <rect x="144" y="24" width="16" height="112" fill="#f2f0e8"/>
  <rect x="160" y="16" width="16" height="128" fill="#f2f0e8"/>
  <rect x="176" y="24" width="16" height="112" fill="#d0d5da"/>
  <rect x="192" y="32" width="16" height="96" fill="#d0d5da"/>
  <rect x="208" y="40" width="16" height="80" fill="#aeb4bc"/>
  <rect x="224" y="48" width="16" height="64" fill="#8f969d"/>
  <rect x="240" y="56" width="16" height="48" fill="#8f969d"/>
  <rect x="256" y="64" width="16" height="32" fill="#70777d"/>
  <rect x="272" y="72" width="16" height="16" fill="#596168"/>

  <!-- cockpit -->
  <rect x="152" y="48" width="40" height="32" fill="#1a758b"/>
  <rect x="160" y="40" width="24" height="8" fill="#67e9ff"/>
  <rect x="160" y="56" width="24" height="16" fill="#59d9ef"/>
  <rect x="168" y="56" width="16" height="8" fill="#b9f7ff"/>

  <!-- lower stabilizers -->
  <rect x="112" y="104" width="32" height="16" fill="#8f969d"/>
  <rect x="192" y="104" width="32" height="16" fill="#8f969d"/>
  <rect x="104" y="112" width="24" height="8" fill="#e6ff3f"/>
  <rect x="208" y="112" width="24" height="8" fill="#e6ff3f"/>

  <!-- pixel details -->
  <rect x="120" y="80" width="16" height="8" fill="#e6ff3f"/>
  <rect x="200" y="80" width="16" height="8" fill="#e6ff3f"/>
  <rect x="224" y="64" width="8" height="8" fill="#e6ff3f"/>
</svg>
